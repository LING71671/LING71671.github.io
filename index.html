<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LING71671 的个人博客主页 - 创意开发者">
  <title>LING71671 - Personal Blog</title>

  <!-- Google Fonts: 治愈模式用 Varela Round，恐怖模式用 Creepster -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Creepster&family=Noto+Sans+SC:wght@400;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

  <!-- ============================================================
       ⚠️ 光敏性癫痫警告 (Photosensitive Epilepsy Warning)
       本页面包含一个隐藏模式，其中包含：
       - 快速闪烁的灯光效果
       - 剧烈的屏幕抖动和颜色反转
       - 随机的屏幕黑屏
       如果您对闪烁灯光敏感，请谨慎操作。
       ============================================================ -->



  <!-- Glitch 过渡动画覆盖层 -->
  <div id="glitch-overlay" class="glitch-overlay" aria-hidden="true">
    <canvas id="glitch-canvas"></canvas>
  </div>

  <!-- 恐怖模式背景噪点 Canvas -->
  <canvas id="noise-canvas" class="noise-canvas" aria-hidden="true"></canvas>

  <!-- 扫描线叠加层 -->
  <div class="scanlines" aria-hidden="true"></div>

  <!-- 光标残留容器 -->
  <div id="cursor-trails" aria-hidden="true"></div>

  <!-- 主体内容 -->
  <div class="container">

    <!-- 头部区域：头像 + 用户信息 -->
    <header class="profile-header glass-header">
      <div class="avatar-wrapper">
        <img id="avatar" src="" alt="用户头像" class="avatar" loading="lazy">
        <div class="avatar-glitch-layer" aria-hidden="true"></div>
      </div>
      <h1 id="username" class="username">Loading...</h1>
      <p id="bio" class="bio">Fetching profile...</p>
      <div class="header-decorations">
        <span class="deco-dot"></span>
        <span class="deco-line"></span>
        <span class="deco-dot"></span>
      </div>
    </header>

    <!-- 动态文章系统 -->
    <section class="articles-section">
      <h2 class="section-title">
        <span class="title-icon">📰</span>
        <span id="articles-title-text">最新日志</span>
      </h2>
      <div id="articles-list" class="articles-list">
        <!-- 文章列表动态生成 -->
        <div class="loading-placeholder">加载中...</div>
      </div>
    </section>

    <!-- 资源下载区 -->
    <section class="downloads-section">
      <h2 class="section-title">
        <span class="title-icon">💾</span>
        <span id="downloads-title-text">资源下载</span>
      </h2>
      <div id="downloads-grid" class="downloads-grid">
        <!-- 下载卡片动态生成 -->
      </div>
    </section>

    <!-- 原创仓库区 -->
    <section class="repos-section">
      <h2 class="section-title">
        <span class="title-icon">📦</span>
        <span id="original-repos-title">原创作品</span>
      </h2>
      <div id="original-repos-grid" class="repos-grid original-grid">
        <!-- 原创仓库卡片动态生成 -->
      </div>
    </section>

    <!-- Fork 仓库区 -->
    <section class="repos-section fork-section">
      <h2 class="section-title">
        <span class="title-icon">🍴</span>
        <span id="fork-repos-title">衍生/Fork</span>
      </h2>
      <div id="fork-repos-grid" class="repos-grid fork-grid">
        <!-- Fork 仓库卡片动态生成 -->
      </div>
    </section>

    <!-- 页脚 + 隐藏触发像素点 -->
    <footer class="site-footer">
      <p class="footer-text">
        Built with <span class="heart">♥</span> by LING71671
      </p>
      <p class="footer-sub">Powered by GitHub API & Vanilla JS</p>
      <!-- 隐藏触发点：几乎不可见的 1x1 像素 -->
      <div id="secret-pixel" class="secret-pixel" title="" aria-hidden="true"></div>
    </footer>

  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>

</html>
